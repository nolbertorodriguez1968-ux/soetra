<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.O.E.T.R.A. - F.A.T.R.E.F.U. - Padrón Completo</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f2f2f2;color:#222}
header{background:#1a5c1a;color:#fff;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;font-size:13px}
.barra{background:#fff;padding:12px;position:sticky;top:78px;z-index:9;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.barra input{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px}
.barra button{margin-top:8px;padding:10px 14px;border:0;border-radius:8px;background:#1a5c1a;color:#fff;font-size:14px;cursor:pointer}
.cont{max-width:900px;margin:12px auto;padding:0 10px 40px}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.card h3{margin:0 0 4px;color:#1a5c1a}
.card p{margin:2px 0;font-size:14px}
.btn{display:inline-block;padding:9px 14px;border-radius:8px;background:#1a5c1a;color:#fff;text-decoration:none;font-weight:bold;font-size:14px;margin:4px 4px 0 0;border:0;cursor:pointer}
.btn.gris{background:#666}
.btn.azul{background:#0b4a7a}
.btn.rojo{background:#b00020}
.carpeta{border-top:1px solid #ddd;margin-top:12px;padding-top:10px}
.doc{border:1px solid #e0e0e0;border-radius:10px;padding:10px;margin:10px 0}
.doc b{font-size:15px}
.sin{color:#8a1c1c;font-weight:bold}
.con{color:#0a8a2f;font-weight:bold}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
.oculto{display:none}
.aviso{background:#fff3cd;border:1px solid #ffcc00;padding:10px;border-radius:8px;font-size:14px;margin-bottom:10px}
.detalle{font-size:14px}
</style>
</head>
<body>
<header>
<h1>🌾 S.O.E.T.R.A. - F.A.T.R.E.F.U.</h1>
<p>Padrón Completo - Teléfono y PC</p>
</header>

<div class="barra">
<input id="buscador" placeholder="🔍 Buscar por apellido, nombre o DNI..." oninput="render()">
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button onclick="mostrarLogin()">🔐 Entrar como Admin</button>
<button id="btnSalir" class="oculto" onclick="salir()">Salir de Admin</button>
<button onclick="agregarAfiliado()" id="btnAgregar" class="oculto">➕ Agregar afiliado</button>
</div>
<div id="loginBox" class="oculto" style="margin-top:10px">
<input id="usuarioAdmin" type="text" placeholder="Usuario - ej: nolberto37@hotmail.com" autocomplete="username">
<input id="claveAdmin" type="password" placeholder="Contraseña" autocomplete="current-password">
<button onclick="entrarAdmin()">INGRESAR</button>
<p id="msgLogin"></p>
<p style="font-size:12px;color:#666">Las claves ya no están en el código. Las verifica Firebase.</p>
</div>
<p id="infoAdmin" style="font-size:13px"></p>
</div>

<div class="cont">
<div class="aviso">👉 Tocá un afiliado para ver su carpeta. Solo Admin puede cargar archivos. Las fotos y los PDF quedan guardados en la nube y se ven en todos los celus.</div>
<div id="lista"></div>
</div>

<input type="file" id="fileInput" class="oculto">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// ===== FIREBASE - SOLO CONFIG, SIN CLAVES =====
const firebaseConfig = {
  apiKey: "AIzaSyAz2QsNccuKVxC4YDebOJaR1dNXBAIOCBc",
  authDomain: "admin-soetra.firebaseapp.com",
  projectId: "admin-soetra",
  storageBucket: "admin-soetra.firebasestorage.app",
  messagingSenderId: "90980716540",
  appId: "1:90980716540:web:101e3e32322a01734ec79",
  measurementId: "G-FS381E2H3F"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// ===== CLOUDINARY =====
const CLOUD_NAME = "moacgopg";
const UPLOAD_PRESET = "soetra";

const TIPOS_DOC = [
  {key:"DNI", label:"DNI"},
  {key:"Solicita-Autoriza", label:"Solicita-Autoriza"},
  {key:"Telegrama_Renuncia_UATRE", label:"Telegrama Renuncia UATRE"},
  {key:"Telegrama_Renuncia", label:"Telegrama Renuncia"},
  {key:"Ficha_Afiliacion", label:"Ficha de Afiliación"},
  {key:"Recibo_Sueldo", label:"Recibo de Sueldo"}
];

let AFILIADOS = [];
try{ AFILIADOS = JSON.parse(localStorage.getItem("soetra_padron_v2")||"[]"); }catch(e){ AFILIADOS=[]; }
if(!AFILIADOS.length){
  AFILIADOS = [{dni:"20203627298", apellido:"RODRIGUEZ", nombre:"NOLBERTO", telefono:"", localidad:"James Craik", archivos:{}, telegrama:"Renuncia a SOETRA"}];
  guardarLocal();
}
function guardarLocal(){ localStorage.setItem("soetra_padron_v2", JSON.stringify(AFILIADOS)); }

let ES_ADMIN = false;
let NOMBRE_ADMIN = "";
let subirParaDNI = null;
let subirParaTipo = null;

window.mostrarLogin = function(){ document.getElementById("loginBox").classList.toggle("oculto"); }

window.entrarAdmin = async function(){
  const u = (document.getElementById("usuarioAdmin").value||"").trim();
  const c = document.getElementById("claveAdmin").value||"";
  document.getElementById("msgLogin").textContent = "Verificando...";
  try{
    const cred = await signInWithEmailAndPassword(auth, u, c);
    NOMBRE_ADMIN = cred.user.email;
    ES_ADMIN = true;
    document.getElementById("msgLogin").textContent = "Bienvenido " + NOMBRE_ADMIN;
    document.getElementById("loginBox").classList.add("oculto");
    render();
  }catch(e){
    document.getElementById("msgLogin").textContent = "Usuario o contraseña incorrectos. ¿Creaste el usuario en Firebase Authentication?";
  }
}
window.salir = async function(){
  try{ await signOut(auth); }catch(e){}
  ES_ADMIN=false; NOMBRE_ADMIN=""; render();
}

onAuthStateChanged(auth, (user)=>{
  if(user){ ES_ADMIN=true; NOMBRE_ADMIN=user.email; }
  else { ES_ADMIN=false; NOMBRE_ADMIN=""; }
  render();
});

window.agregarAfiliado = function(){
  const dni = prompt("DNI del afiliado:"); if(!dni) return;
  const ape = prompt("Apellido:")||"";
  const nom = prompt("Nombre:")||"";
  AFILIADOS.push({dni:dni, apellido:ape.toUpperCase(), nombre:nom.toUpperCase(), telefono:"", localidad:"", archivos:{}, telegrama:""});
  guardarLocal(); render();
}

window.render = function(){
  const q = (document.getElementById("buscador").value||"").toLowerCase();
  document.getElementById("btnSalir").classList.toggle("oculto", !ES_ADMIN);
  document.getElementById("btnAgregar").classList.toggle("oculto", !ES_ADMIN);
  document.getElementById("infoAdmin").textContent = ES_ADMIN ? "✅ Estás como ADMIN ("+NOMBRE_ADMIN+") - podés cargar archivos" : "Modo consulta - Solo Admin carga archivos";
  const lista = document.getElementById("lista");
  lista.innerHTML="";
  const filtrados = AFILIADOS.filter(a => (a.apellido+" "+a.nombre+" "+a.dni).toLowerCase().includes(q));
  if(!filtrados.length){ lista.innerHTML="<div class='card'>No se encontró ningún afiliado.</div>"; return; }
  filtrados.forEach(a=>{
    const div = document.createElement("div");
    div.className="card";
    div.innerHTML = `
      <h3>${a.apellido} ${a.nombre}</h3>
      <p><b>DNI:</b> ${a.dni} ${a.localidad ? " - "+a.localidad : ""} ${a.telefono ? " - Tel: "+a.telefono : ""}</p>
      <button class="btn azul" onclick="toggleCarpeta('${a.dni}')">📁 Ver Carpeta</button>
      ${ES_ADMIN ? `<button class="btn rojo" onclick="borrarAfiliado('${a.dni}')">Borrar</button>` : ""}
      <div id="carp-${a.dni}" class="carpeta oculto"></div>
    `;
    lista.appendChild(div);
    dibujarCarpeta(a);
  });
}

window.toggleCarpeta = function(dni){ document.getElementById("carp-"+dni).classList.toggle("oculto"); }
window.borrarAfiliado = function(dni){
  if(!confirm("¿Borrar este afiliado?")) return;
  AFILIADOS = AFILIADOS.filter(a=>a.dni!==dni);
  guardarLocal(); render();
}

function dibujarCarpeta(a){
  const c = document.getElementById("carp-"+a.dni);
  if(!c) return;
  let html = `<div class="detalle"><b>Telegrama Renuncia:</b> ${a.telegrama||""}</div>`;
  if(ES_ADMIN){
    html += `<label style="font-size:13px">Cambiar Telegrama Renuncia:</label>
    <select onchange="cambiarTelegrama('${a.dni}', this.value)">
      <option value="">-- Elegir --</option>
      <option ${a.telegrama==="Renuncia a SOETRA"?"selected":""}>Renuncia a SOETRA</option>
      <option ${a.telegrama==="Renuncia a UATRE"?"selected":""}>Renuncia a UATRE</option>
      <option ${a.telegrama==="No renuncia"?"selected":""}>No renuncia</option>
    </select>`;
  }
  TIPOS_DOC.forEach(t=>{
    const arch = (a.archivos||{})[t.key];
    const tiene = arch && arch.url;
    html += `<div class="doc">
      <b>${t.label}:</b> ${tiene ? `<span class="con">✅ Con archivo (${arch.sizeKB||"?"} KB)</span>` : `<span class="sin">Sin archivo</span>`}<br>
      ${tiene ? `<a class="btn" href="${arch.url}" target="_blank">📄 VER ARCHIVO</a>` : ""}
      ${ES_ADMIN ? `<button class="btn" onclick="elegirArchivo('${a.dni}','${t.key}')">⬆️ CARGAR ARCHIVO (Solo Admin)</button>` : ""}
      ${tiene && ES_ADMIN ? `<button class="btn gris" onclick="borrarArchivo('${a.dni}','${t.key}')">🗑️ Borrar archivo</button>` : ""}
    </div>`;
  });
  c.innerHTML = html;
}

window.cambiarTelegrama = function(dni, val){
  const a = AFILIADOS.find(x=>x.dni===dni); if(!a) return;
  a.telegrama = val; guardarLocal(); dibujarCarpeta(a);
}
window.borrarArchivo = function(dni, tipo){
  if(!confirm("¿Borrar este archivo?")) return;
  const a = AFILIADOS.find(x=>x.dni===dni); if(!a) return;
  if(a.archivos) delete a.archivos[tipo];
  guardarLocal(); dibujarCarpeta(a);
}
window.elegirArchivo = function(dni, tipo){
  subirParaDNI = dni; subirParaTipo = tipo;
  const inp = document.getElementById("fileInput");
  inp.value = ""; inp.click();
}

document.getElementById("fileInput").addEventListener("change", async function(e){
  const file = e.target.files[0]; if(!file) return;
  const a = AFILIADOS.find(x=>x.dni===subirParaDNI); if(!a) return;
  const esPDF = file.type==="application/pdf" || file.name.toLowerCase().endsWith(".pdf");
  const esImagen = file.type.startsWith("image/");
  alert("Subiendo... esperá, no toques nada. Archivo: " + file.name);
  try{
    const fd = new FormData();
    fd.append("file", file);
    fd.append("upload_preset", UPLOAD_PRESET);
    fd.append("folder", "soetra/"+a.dni+"/"+subirParaTipo);
    fd.append("public_id", subirParaTipo + "/" + Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9_.-]/g,"_"));
    const resp = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, { method:"POST", body: fd });
    const data = await resp.json();
    if(!data.secure_url) throw new Error(data.error ? data.error.message : "Error al subir");
    if(!a.archivos) a.archivos={};
    a.archivos[subirParaTipo] = { url: data.secure_url, tipo: esPDF ? "pdf" : (esImagen ? "imagen" : "archivo"), nombre: file.name, sizeKB: Math.round(file.size/1024) };
    guardarLocal(); dibujarCarpeta(a);
    alert("✅ Guardado en la nube para " + a.apellido + " " + a.nombre + " (" + Math.round(file.size/1024) + " KB)\nYa se ve en todos los celus.");
  }catch(err){
    alert("❌ No se pudo subir: " + err.message);
  }
});
render();
</script>
</body>
</html>
